<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ANM Audit Tool</title>
  <link rel="icon" type="image/jpeg" href="images/anm.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0047ab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANM Audit">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ─── Background ─────────────────────────────── */
    .bg-photo {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('images/Background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .bg-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.18);
    }

    /* ─── Page layout ────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ─── Logo area ──────────────────────────────── */
    .header-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-img {
      width: 90px;
      height: auto;
      margin-bottom: 12px;
    }

    .logo-name {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      letter-spacing: 0.5px;
    }

    .logo-tag {
      font-size: 13px;
      color: #666;
      margin-top: 3px;
    }

    /* ─── Form container ─────────────────────────── */
    .form-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ─── Pill inputs ────────────────────────────── */
    .input-wrap {
      position: relative;
    }

    .input-wrap ion-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #999;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      padding: 16px 20px 16px 50px;
      background: #ffffff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: #222;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
      outline: none;
      transition: box-shadow 0.2s ease;
    }

    .input-wrap input:focus {
      box-shadow: 0 4px 20px rgba(0, 71, 171, 0.2);
    }

    .input-wrap input::placeholder { color: #aaa; }

    /* ─── Remember / Forgot row ──────────────────── */
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
    }

    .remember input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #0047ab;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 13px;
      color: #0047ab;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .forgot-link:hover { opacity: 0.7; }

    /* ─── Button ─────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: #0047ab;
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .btn-primary:hover {
      background: #003580;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 71, 171, 0.35);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Message ────────────────────────────────── */
    .msg {
      text-align: center;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .msg.show    { display: block; }
    .msg.error   { background: rgba(255,0,0,0.07); color: #cc0000; }
    .msg.success { background: rgba(0,128,0,0.07); color: #007700; }
    .msg.loading { background: rgba(0,0,0,0.05); color: #555; }

    /* autofill fix */
    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #222 !important;
      transition: background-color 999999s;
      box-shadow: 0 0 0 1000px #ffffff inset !important;
      caret-color: #222;
    }

    /* ─── Mobile ─────────────────────────────────── */
    @media (max-width: 480px) {
      .logo-img { width: 70px; }
      .logo-name { font-size: 19px; }
      .form-container { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="bg-photo"></div>

<div class="page">

  <!-- Logo -->
  <div class="header-area">
    <img src="images/ANM A.png" class="logo-img" alt="ANM">
    <div class="logo-name">A N M Sri Lanka</div>
    <div class="logo-tag">Secure workspace</div>
  </div>

  <!-- Form -->
  <div class="form-container">

    <div class="input-wrap">
      <ion-icon name="mail-outline"></ion-icon>
      <input type="email" id="email" placeholder="Email Address" autocomplete="username" required />
    </div>

    <div class="input-wrap">
      <ion-icon name="lock-closed-outline"></ion-icon>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="rememberMe"> Remember me
      </label>
      <a href="forget.html" class="forgot-link">Forgot password?</a>
    </div>

    <button class="btn-primary" id="loginBtn" data-label="Get Started">Get Started</button>

    <div class="msg" id="message"></div>

  </div>
</div>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://tdcusqldrsrogtsafeev.supabase.co';
  const supabaseKey = 'sb_publishable_zq8kXpPwoXhR10VUKWTLMQ_mYiFocTQ';
  const supaClient = supabase.createClient(supabaseUrl, supabaseKey);

  function showMessage(text, type = "error") {
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = `msg show ${type}`;
  }

  function setLoading(loading) {
    const btn = document.getElementById("loginBtn");
    if (loading) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Signing in...`;
    } else {
      btn.disabled = false;
      btn.innerHTML = btn.dataset.label;
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
  });

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("Please enter your email and password.", "error");
      return;
    }

    setLoading(true);
    showMessage("Signing you in...", "loading");

    const { data, error } = await supaClient.auth.signInWithPassword({ email, password });

    setLoading(false);

    if (error) {
      showMessage(error.message || "Login failed. Check your credentials.", "error");
      return;
    }

    showMessage("Login successful! Redirecting...", "success");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
