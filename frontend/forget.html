<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ANM Audit Tool</title>
  <link rel="icon" type="image/jpeg" href="images/anm.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0047ab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ANM Audit">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ─── Background ─────────────────────────────── */
    .bg-photo {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('images/Background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .bg-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.18);
    }

    /* ─── Page layout ────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ─── Logo area ──────────────────────────────── */
    .header-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-img {
      width: 90px;
      height: auto;
      margin-bottom: 12px;
    }

    .logo-name {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      letter-spacing: 0.5px;
    }

    .logo-tag {
      font-size: 13px;
      color: #666;
      margin-top: 3px;
    }

    /* ─── Container ──────────────────────────────── */
    .form-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ─── Steps indicator ────────────────────────── */
    .steps {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .step-dot {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #ddd;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      color: #aaa;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .step-dot.active {
      border-color: #0047ab;
      color: #0047ab;
      box-shadow: 0 0 12px rgba(0,71,171,0.2);
    }

    .step-dot.done {
      background: #0047ab;
      border-color: #0047ab;
      color: #fff;
    }

    .step-line {
      width: 40px; height: 2px;
      background: #ddd;
      margin: 0 6px;
      transition: background 0.3s ease;
    }

    .step-line.done { background: #0047ab; }

    /* ─── Step headings ──────────────────────────── */
    .heading {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      text-align: center;
    }

    .subheading {
      font-size: 13px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    /* ─── Pill inputs ────────────────────────────── */
    .field input {
      width: 100%;
      padding: 16px 20px;
      background: #ffffff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: #222;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      outline: none;
      text-align: center;
      transition: box-shadow 0.2s ease;
    }

    .field input:focus {
      box-shadow: 0 4px 20px rgba(0,71,171,0.2);
    }

    .field input::placeholder { color: #aaa; }

    .otp-input {
      letter-spacing: 6px !important;
      font-size: 22px !important;
      font-weight: 700 !important;
    }

    /* ─── Button ─────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: #0047ab;
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #003580;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,71,171,0.35);
    }

    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-primary .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Back link ──────────────────────────────── */
    .back-link {
      text-align: center;
      display: block;
      color: #0047ab;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .back-link:hover { opacity: 0.7; }

    /* ─── Message ────────────────────────────────── */
    .msg {
      text-align: center;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .msg.show    { display: block; }
    .msg.error   { background: rgba(255,0,0,0.07); color: #cc0000; }
    .msg.success { background: rgba(0,128,0,0.07); color: #007700; }
    .msg.loading { background: rgba(0,0,0,0.05); color: #555; }

    /* ─── Step sections ──────────────────────────── */
    .step-section { display: none; }
    .step-section.active { display: flex; flex-direction: column; gap: 14px; }

    /* ─── Mobile ─────────────────────────────────── */
    @media (max-width: 480px) {
      .logo-img { width: 70px; }
      .logo-name { font-size: 19px; }
      .form-container { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="bg-photo"></div>

<div class="page">

  <!-- Logo -->
  <div class="header-area">
    <img src="images/ANM A.png" class="logo-img" alt="ANM">
    <div class="logo-name">A N M Sri Lanka</div>
    <div class="logo-tag">Password Recovery</div>
  </div>

  <div class="form-container">

    <!-- Steps -->
    <div class="steps">
      <div class="step-dot active" id="dot1">1</div>
      <div class="step-line" id="line1"></div>
      <div class="step-dot" id="dot2">2</div>
      <div class="step-line" id="line2"></div>
      <div class="step-dot" id="dot3">3</div>
    </div>

    <!-- Step 1: Email -->
    <div class="step-section active" id="step-email">
      <div class="heading">Forgot password?</div>
      <div class="subheading">Enter your registered email and we'll send you a 6-digit OTP.</div>
      <div class="field">
        <input type="email" id="email" placeholder="Email Address" autocomplete="email" />
      </div>
      <button class="btn-primary" id="sendOtpBtn">Send OTP</button>
    </div>

    <!-- Step 2: OTP -->
    <div class="step-section" id="step-otp">
      <div class="heading">Check your email</div>
      <div class="subheading" id="otp-hint">Enter the 6-digit code we sent to your email.</div>
      <div class="field">
        <input type="text" id="otp" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
      </div>
      <button class="btn-primary" id="verifyOtpBtn">Verify OTP</button>
    </div>

    <!-- Step 3: New Password -->
    <div class="step-section" id="step-password">
      <div class="heading">Set new password</div>
      <div class="subheading">Choose a strong password — at least 6 characters.</div>
      <div class="field">
        <input type="password" id="newPassword" placeholder="New Password" autocomplete="new-password" />
      </div>
      <button class="btn-primary" id="updatePasswordBtn">Update Password</button>
    </div>

    <div class="msg" id="message"></div>
    <a href="index.html" class="back-link">← Back to login</a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://tdcusqldrsrogtsafeev.supabase.co';
  const supabaseKey = 'sb_publishable_zq8kXpPwoXhR10VUKWTLMQ_mYiFocTQ';

  let userEmail = "";
  let verifiedOtp = "";

  function showMessage(text, type = "info") {
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = `msg show ${type}`;
  }

  function setStep(n) {
    [1,2,3].forEach(i => {
      document.getElementById(`step-${['email','otp','password'][i-1]}`).classList.toggle('active', i === n);
      const dot = document.getElementById(`dot${i}`);
      dot.classList.remove('active','done');
      if (i < n) dot.classList.add('done');
      else if (i === n) dot.classList.add('active');
    });
    [1,2].forEach(i => {
      document.getElementById(`line${i}`)?.classList.toggle('done', i < n);
    });
    document.getElementById("message").className = "msg";
  }

  function setLoading(btnId, loading, label) {
    const btn = document.getElementById(btnId);
    if (loading) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Please wait...`;
    } else {
      btn.disabled = false;
      btn.innerHTML = label;
    }
  }

  async function callFunction(name, body) {
    const res = await fetch(`${supabaseUrl}/functions/v1/${name}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": supabaseKey,
        "Authorization": `Bearer ${supabaseKey}`
      },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    return { data, ok: res.ok };
  }

  document.getElementById("sendOtpBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim().toLowerCase();
    if (!email) return showMessage("Please enter your email.", "error");

    setLoading("sendOtpBtn", true);
    showMessage("Sending OTP...", "loading");
    const { data, ok } = await callFunction("send-reset-otp", { email });
    setLoading("sendOtpBtn", false, "Send OTP");

    if (!ok || data?.error) {
      showMessage(data?.error || "Failed to send OTP.", "error");
      return;
    }
    userEmail = email;
    document.getElementById("otp-hint").textContent = `We sent a code to ${email}`;
    setStep(2);
    showMessage("OTP sent! Check your inbox.", "success");
  });

  document.getElementById("verifyOtpBtn").addEventListener("click", () => {
    const otp = document.getElementById("otp").value.trim();
    if (otp.length < 6) return showMessage("Enter the 6-digit OTP.", "error");
    verifiedOtp = otp;
    setStep(3);
  });

  document.getElementById("updatePasswordBtn").addEventListener("click", async () => {
    const newPassword = document.getElementById("newPassword").value;
    if (newPassword.length < 6) return showMessage("Password must be at least 6 characters.", "error");

    setLoading("updatePasswordBtn", true);
    showMessage("Updating password...", "loading");
    const { data, ok } = await callFunction("verify-reset-otp", {
      email: userEmail,
      otp: verifiedOtp,
      newPassword
    });
    setLoading("updatePasswordBtn", false, "Update Password");

    if (!ok || data?.error) {
      showMessage(data?.error || "Reset failed. Try again.", "error");
      return;
    }
    showMessage("Password updated! Redirecting...", "success");
    setTimeout(() => { window.location.href = "index.html"; }, 2000);
  });

  document.getElementById("otp").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
