<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANM Audit Tool</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <section>
        <div class="login-box">

         <div class="login-box">
    <div class="logo-container">
        <img src="images/WhatsApp Image 2026-01-06 at 11.19.28 PM.jpeg" alt="Logo" class="form-logo">
    </div>

            <form action="" autocomplete="off">

                <h2>Login</h2>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                   <input type="email" id="email" name="email" autocomplete="username" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <label>Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="forget.html">Forgot Password?</a>
                </div>
                <button type="submit">Login</button>
                <div class="register-link">
                    <p>Don't have an account? <a href="#" id="register-btn">Register</a></p>
                </div>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. Initialize Supabase
    const supabaseUrl = 'https://tdcusqldrsrogtsafeev.supabase.co';
    const supabaseKey = 'sb_publishable_zq8kXpPwoXhR10VUKWTLMQ_mYiFocTQ';
    const supaClient = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. Select elements
    const loginForm = document.querySelector('form');
    const registerLink = document.querySelector('#register-btn');

    // 3. Handle Form Submission
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Prevent page refresh

        const email = loginForm.querySelector('input[type="email"]').value;
        const password = loginForm.querySelector('input[type="password"]').value;

        // Sign in with Supabase
        const { data, error } = await supaClient.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            alert("Login Failed: " + error.message);
        } else {
            window.location.href = 'dashboard.html';
            // Redirect user to a dashboard page
            // window.location.href = 'dashboard.html';
        }
    });

    const forgotBtn = document.getElementById("forgot-btn");

forgotBtn.addEventListener("click", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  if (!email) {
    alert("Enter your email first, then click Forgot Password.");
    return;
  }

  const { error } = await supaClient.auth.resetPasswordForEmail(email, {
    redirectTo: "http://127.0.0.1:5500/reset.html",
  });

  if (error) {
    alert("Reset error: " + error.message);
  } else {
    alert("Password reset email sent. Check your inbox/spam.");
  }
});
    

registerLink.addEventListener('click', async (e) => {
    e.preventDefault();
    
    const email = loginForm.querySelector('input[type="email"]').value;
    const password = loginForm.querySelector('input[type="password"]').value;

    if (!email || !password) {
        alert("Please enter both email and password to register.");
        return;
    }

    const { data, error } = await supaClient.auth.signUp({
        email: email,
        password: password,
    });

    if (error) {
        alert("Registration Error: " + error.message);
    } else {
        alert("Registration Successful! You can now log in.");
    }
});
</script>
</body>
</html>
