<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ANM Audit Tool</title>
  <link rel="icon" type="image/jpeg" href="images/anm.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080e1a;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --border-focus: rgba(99,148,255,0.6);
      --text: #e8edf8;
      --muted: #7a8aaa;
      --accent: #4f7cff;
      --accent-glow: rgba(79,124,255,0.25);
      --success: #2dd4bf;
      --error: #ff5572;
      --warning: #fbbf24;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* Animated background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg::before {
      content: '';
      position: absolute;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(79,124,255,0.12) 0%, transparent 70%);
      top: -200px; left: -200px;
      animation: drift1 18s ease-in-out infinite alternate;
    }

    .bg::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(45,212,191,0.08) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: drift2 14s ease-in-out infinite alternate;
    }

    .bg-orb {
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,85,114,0.06) 0%, transparent 70%);
      top: 50%; left: 60%;
      transform: translate(-50%, -50%);
      animation: drift3 20s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(80px, 60px); } }
    @keyframes drift2 { to { transform: translate(-60px, -40px); } }
    @keyframes drift3 { to { transform: translate(-50%, -50%) translate(40px, -30px); } }

    /* Grid lines */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Main layout */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 40px 80px rgba(0,0,0,0.5),
        0 0 60px rgba(79,124,255,0.04);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 10px;
    }

    .logo-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    .logo-tag {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Steps indicator */
    .steps {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 28px;
    }

    .step-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .step-dot.active {
      border-color: var(--accent);
      background: rgba(79,124,255,0.15);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(79,124,255,0.3);
    }

    .step-dot.done {
      border-color: var(--success);
      background: rgba(45,212,191,0.12);
      color: var(--success);
    }

    .step-line {
      flex: 1;
      height: 1.5px;
      background: var(--border);
      transition: background 0.3s ease;
    }

    .step-line.done {
      background: var(--success);
    }

    /* Heading */
    .heading {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .subheading {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Input */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }

    .field input:focus {
      border-color: var(--border-focus);
      background: rgba(79,124,255,0.06);
      box-shadow: 0 0 0 3px rgba(79,124,255,0.1);
    }

    .field input::placeholder { color: rgba(255,255,255,0.2); }

    /* OTP input special style */
    .otp-input {
      text-align: center;
      font-family: 'DM Mono', monospace !important;
      font-size: 22px !important;
      letter-spacing: 8px;
      padding: 16px !important;
    }

    /* Button */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover {
      background: #6b92ff;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(79,124,255,0.35);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading spinner inside button */
    .btn-primary .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Message toast */
    .msg {
      margin-top: 16px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

    .msg.show { display: block; }
    .msg.info  { background: rgba(79,124,255,0.12); border: 1px solid rgba(79,124,255,0.25); color: #8fb4ff; }
    .msg.success { background: rgba(45,212,191,0.12); border: 1px solid rgba(45,212,191,0.25); color: #2dd4bf; }
    .msg.error { background: rgba(255,85,114,0.12); border: 1px solid rgba(255,85,114,0.25); color: #ff8099; }
    .msg.loading { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--text); }

    /* Step sections */
    .step-section { display: none; }
    .step-section.active { display: block; animation: fadeIn 0.3s ease; }

    /* autofill fix */
    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text) !important;
      transition: background-color 999999s;
      box-shadow: 0 0 0 1000px rgba(79,124,255,0.06) inset !important;
      caret-color: var(--text);
    }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-orb"></div>
</div>
<div class="grid-overlay"></div>

<div class="page">
  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="images/WhatsApp Image 2026-01-06 at 11.19.28 PM.jpeg" class="logo-img" alt="ANM">
      <div>
        <div class="logo-name">ANM Audit Tool</div>
        <div class="logo-tag">Password Recovery</div>
      </div>
    </div>

    <!-- Steps indicator -->
    <div class="steps">
      <div class="step-dot active" id="dot1">1</div>
      <div class="step-line" id="line1"></div>
      <div class="step-dot" id="dot2">2</div>
      <div class="step-line" id="line2"></div>
      <div class="step-dot" id="dot3">3</div>
    </div>

    <!-- STEP 1: Email -->
    <div class="step-section active" id="step-email">
      <div class="heading">Forgot password?</div>
      <div class="subheading">Enter your registered email and we'll send you a 6-digit OTP.</div>

      <div class="field">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <button class="btn-primary" id="sendOtpBtn">Send OTP</button>
    </div>

    <!-- STEP 2: OTP -->
    <div class="step-section" id="step-otp">
      <div class="heading">Check your email</div>
      <div class="subheading" id="otp-hint">Enter the 6-digit code we sent to your email.</div>

      <div class="field">
        <label>One-time password</label>
        <input type="text" id="otp" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />
      </div>

      <button class="btn-primary" id="verifyOtpBtn">Verify OTP</button>
    </div>

    <!-- STEP 3: New Password -->
    <div class="step-section" id="step-password">
      <div class="heading">Set new password</div>
      <div class="subheading">Choose a strong password — at least 6 characters.</div>

      <div class="field">
        <label>New password</label>
        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <button class="btn-primary" id="updatePasswordBtn">Update Password</button>
    </div>

    <!-- Message -->
    <div class="msg" id="message"></div>

    <a href="index.html" class="back-link">
      ← Back to login
    </a>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = 'https://tdcusqldrsrogtsafeev.supabase.co';
const supabaseKey = 'sb_publishable_zq8kXpPwoXhR10VUKWTLMQ_mYiFocTQ';

let userEmail = "";
let verifiedOtp = "";

// --- UI helpers ---
function showMessage(text, type = "info") {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = `msg show ${type}`;
}

function setStep(n) {
  [1,2,3].forEach(i => {
    document.getElementById(`step-${['email','otp','password'][i-1]}`).classList.toggle('active', i === n);
    const dot = document.getElementById(`dot${i}`);
    dot.classList.remove('active','done');
    if (i < n) dot.classList.add('done');
    else if (i === n) dot.classList.add('active');
  });
  [1,2].forEach(i => {
    document.getElementById(`line${i}`)?.classList.toggle('done', i < n);
  });
  document.getElementById("message").className = "msg"; // hide message on step change
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Please wait...`;
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.label;
  }
}

// Save button labels
document.querySelectorAll('.btn-primary').forEach(b => b.dataset.label = b.textContent);

// --- API helper ---
async function callFunction(name, body) {
  const res = await fetch(`${supabaseUrl}/functions/v1/${name}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": supabaseKey,
      "Authorization": `Bearer ${supabaseKey}`
    },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  return { data, ok: res.ok };
}

// --- STEP 1: Send OTP ---
document.getElementById("sendOtpBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim().toLowerCase();
  if (!email) return showMessage("Please enter your email address.", "error");

  setLoading("sendOtpBtn", true);
  showMessage("Sending OTP to your email...", "loading");

  const { data, ok } = await callFunction("send-reset-otp", { email });

  setLoading("sendOtpBtn", false);

  if (!ok || data?.error) {
    showMessage(data?.error || "Failed to send OTP. Try again.", "error");
    return;
  }

  userEmail = email;
  document.getElementById("otp-hint").textContent = `We sent a code to ${email}`;
  setStep(2);
  showMessage("OTP sent! Check your inbox.", "success");
});

// --- STEP 2: Verify OTP ---
document.getElementById("verifyOtpBtn").addEventListener("click", () => {
  const otp = document.getElementById("otp").value.trim();
  if (!otp || otp.length < 6) return showMessage("Enter the 6-digit OTP.", "error");

  verifiedOtp = otp;
  setStep(3);
});

// --- STEP 3: Update Password ---
document.getElementById("updatePasswordBtn").addEventListener("click", async () => {
  const newPassword = document.getElementById("newPassword").value;
  if (newPassword.length < 6) return showMessage("Password must be at least 6 characters.", "error");

  setLoading("updatePasswordBtn", true);
  showMessage("Updating your password...", "loading");

  const { data, ok } = await callFunction("verify-reset-otp", {
    email: userEmail,
    otp: verifiedOtp,
    newPassword
  });

  setLoading("updatePasswordBtn", false);

  if (!ok || data?.error) {
    showMessage(data?.error || "Password reset failed. Try again.", "error");
    return;
  }

  showMessage("Password updated successfully! Redirecting...", "success");
  setTimeout(() => { window.location.href = "index.html"; }, 2000);
});

// Auto-format OTP input (numbers only)
document.getElementById("otp").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});
</script>
</body>
</html>
